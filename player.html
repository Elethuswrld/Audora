<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Critical for mobile responsiveness -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audora Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="player-container">

    <!-- Header -->
    <header class="player-header">
      <img src="assets/logo.png" alt="Audora Logo" class="logo-small">
      <h1>Audora</h1>
    </header>

    <!-- Player -->
    <div class="player">

      <!-- Album -->
      <img id="cover" src="assets/covers/cover1.jpg" class="album-art" alt="Album Cover">
      
      <!-- Info -->
      <div class="track-info">
        <h2 id="title">Song Title</h2>
        <p id="artist">Artist Name</p>
      </div>

      <!-- Audio -->
      <audio id="audio"></audio>

      <!-- Primary Controls -->
      <div class="controls primary">
        <button id="prev">⏮</button>
        <button id="play" class="play-btn">▶</button>
        <button id="next">⏭</button>
      </div>

      <!-- Secondary Controls -->
      <div class="controls secondary">
        <button id="shuffle">🔀</button>
        <button id="repeat">🔁</button>
        <button id="fav">❤️</button>
      </div>

      <!-- Progress -->
      <div class="progress-container">
        <span id="current-time">0:00</span>
        <input type="range" id="progress" value="0">
        <span id="duration">0:00</span>
      </div>

      <!-- Volume -->
      <div class="volume-container">
        🔊
        <input type="range" id="volume" min="0" max="1" step="0.1" value="1">
      </div>

    </div>

    <!-- Playlist -->
    <section class="playlist-section">
      <h2>Playlist</h2>
      <ul id="playlist"></ul>
    </section>

    <!-- Favorites -->
    <section class="favorites-section">
      <h2>Favorites</h2>
      <ul id="favorites"></ul>
    </section>

    <!-- History -->
    <section class="history-section">
      <h2>Recently Played</h2>
      <ul id="history"></ul>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
